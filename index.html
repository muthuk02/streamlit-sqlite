<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Home</title>
</head>
<body>
    <!-- As a heading -->
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">#</span>
        </div>
    </nav>
    <div id="main">
        <label class="top_header">Fault Maintenance Recommender</label>
        <div class="row main-row">
            <div id="left_pannel" class="card mb-2 col-md-5 align-self-sm-start">
                <div class="card-body">
                    <div class="row padding-bottom-40">
                        <div class="col-lg-6">
                            <label class="child_label">System</label>
                            <div class="input-group">
                                <select class="selectpicker form-control" id="ddSystem" data-live-search="true">
                                    <option value="USV">USV</option>
                                    <option value="Others">Others</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row padding-bottom-40">
                        <label class="child_label">Please ask your questions here:</label>
                            <div class="input-group">
                                <input class="form-control input_prob_desc" value="" id="txtProbDesc" />
                                <input type="submit" value="Submit">
                            </div>
                            <div id="emptyPD" class="alert alert-error error-message" style="display:none;">
                                Problem description cannot be empty.
                        </div>
                    </div>
                    <div class="row" style="padding-bottom:10px">
                        <div class="col-lg-12" style="text-align:right">
                            <a class="clearbtn" id="btnClear">
                                Clear
                            </a>
                            <a class="bluebtn" id="btnClick">
                                Apply
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div id="right_pannel" class="col-md-7 main-row" style="padding-right:0;">
                <div class="card mb-2 col-md-12">
                    <div class="card-body">
                        <span class="sub_header">Top <span id="count_val"></span> Recommended Results</span>
                        <div class="recommendations">
                            <table class="table table-borderless" id="recommendations" style="border-color:white;margin-top:20px;"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
